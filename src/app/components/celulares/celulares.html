<section class="container py-4">
  <h2 class="h3 mb-1">Accesorios de Celulares</h2>
  <p class="text-muted mb-3">Cargadores, fundas, protectores y cables para tu celular.</p>

  <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-4">
    @for (item of productosCelulares; track item.id) {
      <div class="col">
        <app-tarjeta-producto
          [producto]="item"
          (agregarAlCarrito)="manejarAgregarCarrito($event)">
        </app-tarjeta-producto>
      </div>
    }
  </div>
</section>
